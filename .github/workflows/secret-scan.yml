# Scans every push and pull request (with full history) for API keys, tokens and other secrets using gitleaks.
# Free for public repositories. The action and the gitleaks binary are pinned (commit SHA / sha256) so a
# compromised upstream release cannot run code here.
name: secret-scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.21.2
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan full history
        run: ./gitleaks git . --log-opts="--all" --redact --verbose --exit-code 1
