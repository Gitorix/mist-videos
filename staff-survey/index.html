<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ミスト 運営アンケート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-size:15px}
[hidden]{display:none!important}

/* Layout: one narrow column, one question per card, ミストン with a speech bubble above the card */
:root{
  --bg:#efeaf8; --mist:#dcebf7; --surface:#ffffff; --fg:#2b2140; --muted:#6c6283;
  --accent:#6e50aa; --accent-soft:#e6ddf6; --line:#d6cde8; --sel-fg:#ffffff;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17121f; --mist:#1c2333; --surface:#231c30; --fg:#ece6f7; --muted:#a79cbf;
  --accent:#a98ae6; --accent-soft:#33284a; --line:#3a3050; --sel-fg:#17121f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121f; --mist:#1c2333; --surface:#231c30; --fg:#ece6f7; --muted:#a79cbf;
  --accent:#a98ae6; --accent-soft:#33284a; --line:#3a3050; --sel-fg:#17121f; color-scheme:dark}
html,body{min-height:100%}
body{background:linear-gradient(160deg,var(--bg) 0%,var(--mist) 100%);background-color:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:620px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:18px}
.note.demo{display:block}
.demo{color:#b4533a!important}
.note{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.04em}
.top{display:flex;align-items:flex-end;gap:12px}
.chara{width:96px;flex:none;filter:drop-shadow(0 0 10px rgba(169,138,230,.55));transform-origin:50% 100%}
.chara.hop{animation:hop .45s ease}
@keyframes hop{30%{transform:translateY(-10px) rotate(-4deg)}60%{transform:translateY(0) rotate(2deg)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:12px 16px;font-family:var(--display);font-weight:700;font-size:16px;margin-bottom:40px}
.bubble::before{content:"";position:absolute;left:-12px;bottom:18px;border:10px solid transparent;border-right-color:var(--accent);border-left:0}
.bubble::after{content:"";position:absolute;left:-8px;bottom:20px;border:8px solid transparent;border-right-color:var(--surface);border-left:0}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 24px rgba(60,40,110,.08)}
.part{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em}
h1{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.4;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.5;margin:0;text-wrap:balance}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 0}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:500;text-align:left;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sel-fg)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .opt{text-align:center;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.scale .face{font-size:26px;line-height:1.2}
.scale .num{font-size:12px;font-variant-numeric:tabular-nums}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-8px}
textarea{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:110px;resize:vertical;width:100%;box-sizing:border-box}
.q2{display:flex;flex-direction:column;gap:8px}
.q2 label{font-weight:700}
.q2 small{color:var(--muted);font-size:12px}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:99px;padding:10px 22px;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:var(--sel-fg)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.list{display:grid;gap:8px;font-size:14px}
.list div{display:grid;grid-template-columns:3em 1fr;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.list b{color:var(--accent);font-variant-numeric:tabular-nums}
.list span{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.intro ul{margin:0;padding-left:1.2em}
a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){.chara.hop{animation:none}.bar i{transition:none}}
@media (max-width:420px){.chara{width:76px}.scale .face{font-size:22px}h2{font-size:17px}}
</style>

</head>

const QS=[
 {id:"S1",sec:"A",q:"メタカーボンのプロジェクトの進み具合（上場準備・商品展開など）に、どのくらい満足していますか？",scale:["とても不満","とても満足"],ex:"例：満足・不満の理由、気になっている点",say:"まずはミストのプロジェクトについて聞かせてね。"},
 {id:"S2",sec:"A",q:"メタカーボン側の対応（発表の仕方・質問への回答・予定が変わったときの説明）に、満足していますか？",o:["満足している","おおむね満足している","変更時の説明が足りないと感じる","発表や回答そのものに不満がある","予定が変わったことを知らなかった"],ex:"例：いつ頃の・どの発表や対応で・どう感じたか",say:"運営の立場から見て、どうだったかな？"},
 {id:"S3",sec:"A",q:"上場時期が未定であることについて、どのように感じていますか？",o:["納得していて、気長に待てる","仕方ないと思うが、目安は知りたい","いつになるのか不安を感じている","説明に不信感を持っている","特に気にしていない"],ex:"例：そう感じる理由、メンバーの反応で気になったこと",say:"今の正直な気持ちでいいよ。"},
 {id:"S4",sec:"A",q:"これからのメタカーボンとの関わり方に、一番近いものはどれですか？",o:["これまで以上に積極的に関わりたい","今と同じくらい関わりたい","情報だけ追っていく","距離を置きたい"],ex:"例：これから力を入れたいこと、変えたいこと",say:"プロジェクトのパートはこれで最後！"},
 {id:"S5",sec:"B",q:"自分のDiscord運営での関わり方を、自己評価すると何点ですか？",scale:["まだまだ","よくできた"],ex:"自己評価の理由。例：できたこと、難しかったこと",say:"ここからはDiscord運営のことだよ。まずは自己評価！"},
 {id:"S6",sec:"B",q:"運営3人の連携や役割分担は、うまくいっていると思いますか？",o:["うまくいっている","おおむねうまくいっている","少し改善が必要","大きく見直したい"],ex:"例：うまくいっている点、負担の偏り、連絡のしかた",say:"チームワークはどうかな？"},
 {id:"S7",sec:"B",q:"Discord運営について、要望があれば教えてください。",text:true,ex:"例：役割分担、連絡のしかた、ルール、ほしいツールや仕組み",say:"こうしてほしい、があればどうぞ。"},
 {id:"S8",sec:"B",q:"Discord運営をやってみての感想を、自由に書いてください。",text:true,ex:"例：楽しかったこと、大変だったこと、次に挑戦したいこと",say:"最後の質問だよ！"}

const A={}; let step=-1; const T0=Date.now();
const IN_GAS=typeof google!=="undefined"&&google.script&&google.script.run;
const LIVE=!!(IN_GAS||CONFIG.GAS_URL);
if(!LIVE)document.getElementById("demoNote").hidden=false;
const $=id=>document.getElementById(id), card=$("card");
function say(t){$("bubble").textContent=t;const c=$("chara");c.classList.remove("hop");void c.offsetWidth;c.classList.add("hop")}
function prog(on,i){const N=QS.length;$("prog").hidden=!on;if(on){$("barfill").style.width=(Math.min(i,N)/N*100)+"%";$("progtxt").textContent=(i>=N?"確認":(i+1)+" / "+N)}}
function el(tag,attrs={},html){const e=document.createElement(tag);Object.assign(e,attrs);if(html!==undefined)e.innerHTML=html;return e}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function intro(){
  step=-1;prog(false);say("やあ、ブラックミストンだよ。運営のみんな、いつもおつかれさま！今日は運営チームのふりかえりを聞かせてね。");
  card.innerHTML=`<div class="part">運営メンバー向け（3人）</div>
  <h1>ミスト<br>運営アンケート</h1>
  <div class="intro"><ul>
   <li><b>前半</b>：ミストのプロジェクトへの評価と感想（4問）</li>
   <li><b>後半</b>：Discord運営の自己評価・要望・感想（4問）</li>
  </ul></div>
  <p class="hint" style="margin:0">全8問です。選ぶところは必須、どの質問にも具体的に書ける欄があります（任意）。</p>
  <p class="hint" style="margin:0">名前やDiscordアカウントは記録しません。ただ、回答するのは3人なので、書き方や内容から誰の回答か分かることがあります。気になるところは、ぼかして書いて大丈夫です。</p>`;
  const n=el("div",{className:"nav"});const b=el("button",{className:"btn",id:"start"},"はじめる");b.onclick=()=>ask(0);n.append(el("span"),b);card.append(n);
}
function ask(i){
  step=i;const Q=QS[i];prog(true,i);say(Q.say);
  card.innerHTML="";card.append(el("div",{className:"part"},SEC[Q.sec]),el("h2",{},Q.id.replace("S","Q")+". "+esc(Q.q)));
  const n=el("div",{className:"nav"});const back=el("button",{className:"btn ghost"},"戻る");back.onclick=()=>i?ask(i-1):intro();
  const fw=el("button",{className:"btn"},"次へ");fw.onclick=next;
  if(Q.text){
    card.append(el("p",{className:"hint"},(Q.ex?esc(Q.ex)+"<br>":"")+"任意です。空欄のままでも次へ進めます。"));
    const t=el("textarea",{id:Q.id,value:A[Q.id]||""});t.setAttribute("aria-label",Q.q);t.oninput=()=>A[Q.id]=t.value;card.append(t);
  }else{
    const box=el("div",{className:Q.scale?"scale":"opts",role:"group"});
    const items=Q.scale?S5.map(s=>({v:s[1],h:`<span class="face">${s[0]}</span><span class="num">${s[1]}</span>`})):Q.o.map(o=>({v:o,h:esc(o)}));
    items.forEach((it,k)=>{const b=el("button",{className:"opt",id:Q.id+"_"+k},it.h);b.setAttribute("aria-pressed",A[Q.id]===it.v);
      b.onclick=()=>{A[Q.id]=it.v;box.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));fw.disabled=false};box.append(b)});
    card.append(box);
    if(Q.scale)card.append(el("div",{className:"ends"},`<span>${esc(Q.scale[0])}</span><span>${esc(Q.scale[1])}</span>`));
    const cid=Q.id+"c",w=el("div",{className:"q2"});
    w.append(el("label",{htmlFor:cid},"具体的に（任意）"));if(Q.ex)w.append(el("small",{},esc(Q.ex)));
    const t=el("textarea",{id:cid,value:A[cid]||""});t.oninput=()=>A[cid]=t.value;w.append(t);card.append(w);
    fw.disabled=!A[Q.id];
  }
  n.append(back,fw);card.append(n);
}
function next(){if(step<QS.length-1)ask(step+1);else review()}
function review(){
  step=QS.length;prog(true,QS.length);say("最後に確認してね。直したいところは「戻る」で戻れるよ。");
  card.innerHTML="";card.append(el("div",{className:"part"},"確認"),el("h1",{},"この内容で送信します"));
  const l=el("div",{className:"list"});
  QS.forEach(Q=>{const v=(A[Q.id]||"").trim(),c=Q.text?"":(A[Q.id+"c"]||"").trim();l.append(el("div",{},`<b>${Q.id.replace("S","Q")}</b><span>${v?esc(v):'<span style="color:var(--muted)">（未記入）</span>'}${c?"\n"+esc(c):""}</span>`))});
  card.append(l);
  const n=el("div",{className:"nav"});const back=el("button",{className:"btn ghost"},"戻る");back.onclick=()=>ask(QS.length-1);
  const fw=el("button",{className:"btn"},"送信する");fw.onclick=done;n.append(back,fw);card.append(n);
}
function payload(){
  const answers={};QS.forEach(Q=>[Q.id,Q.id+"c"].forEach(k=>{const v=A[k];if(v!==undefined&&String(v).trim()!=="")answers[k]=String(v).trim()}));
  return {form:CONFIG.FORM,answers,hp:document.getElementById("hp").value,elapsedMs:Date.now()-T0};
}
async function send(p){
  if(IN_GAS){const r=await new Promise((ok,ng)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ng).submit(p));if(!r||!r.ok)throw new Error(r&&r.error||"failed");return}
  if(CONFIG.GAS_URL){const res=await fetch(CONFIG.GAS_URL,{method:"POST",body:JSON.stringify(p)});const r=await res.json();if(!r.ok)throw new Error(r.error||"failed");return}
  await new Promise(r=>setTimeout(r,600));
}
let sending=false;
async function done(){
  if(sending)return;sending=true;prog(false);say("送信中だよ。ちょっと待っててね。");
  card.innerHTML=`<div class="part">送信中</div><h1>回答を送っています…</h1>`;
  try{await send(payload())}catch(e){
    sending=false;say("あれれ、うまく送れなかったみたい。");
    card.innerHTML=`<div class="part">送信できませんでした</div><h1>もう一度お試しください</h1><p class="hint" style="margin:0">通信状況を確認して、下のボタンからもう一度送信してください。入力した内容はそのまま残っています。</p>`;
    const n=el("div",{className:"nav"});const back=el("button",{className:"btn ghost"},"内容を確認する");back.onclick=review;const r=el("button",{className:"btn"},"もう一度送信する");r.onclick=done;n.append(back,r);card.append(n);return}
  say("ありがとう！これからもいっしょにミストを盛り上げようね。");
  card.innerHTML=`<div class="part">送信完了</div><h1>ご協力ありがとうございました！</h1>
  <p class="hint" style="margin:0">回答を受け取りました。運営チームのふりかえりと、これからの体制づくりに活かします。</p>`+(LIVE?"":`<p class="hint demo" style="margin:0">（デモモードのため、実際には保存されていません）</p>`);
  for(const k in A)delete A[k];
}
