<style>

  #vignette {

  }

  .head {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 18px);
    left: max(16px, env(safe-area-inset-left, 0px));

    pointer-events: none;
  }

    top: calc(-18px - env(safe-area-inset-top, 0px)); bottom: -28px;

  }

  .dim.b { margin-top: 8px; }
  .dim.t { margin-top: -8px; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: 0.85rem; pointer-events: none; text-align: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));

  #loading[hidden] { display: none; }
  @media (max-width: 520px) {
    .sep { display: none; }
    /* each row of choices stays on one line, down to the narrowest phones below */
    .row { gap: 6px; }
    button { padding: 6px 8px; font-size: 0.78rem; }
    .puff-note { flex-basis: 100%; order: 3; }
    .dim { font-size: 0.64rem; padding: 2px 6px; }
  }
  @media (max-width: 374px) {
    .row { gap: 4px; }
    .dock-inner { padding-inline: 10px; }

    .label { min-width: 3.3em; letter-spacing: 0.04em; }

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
document.getElementById('webfonts')?.setAttribute('media', 'all'); // the fonts were fetched without holding up the page
// three.js r160 and the add-ons below come as one minified file next to the page (vendor/three-bundle-r160.js, built
// from vendor/three-bundle-r160.entry.js), one download instead of a chain of about twenty. A copy of this page
// without that file loads the same modules from the CDN, through the import map above.
const ADDONS = ['controls/OrbitControls', 'postprocessing/EffectComposer', 'postprocessing/RenderPass', 'postprocessing/UnrealBloomPass',
  'postprocessing/OutputPass', 'postprocessing/ShaderPass', 'geometries/RoundedBoxGeometry', 'objects/Reflector',
  'shaders/HorizontalBlurShader', 'shaders/VerticalBlurShader', 'renderers/CSS2DRenderer'];
const THREE = await import('./vendor/three-bundle-r160.js').catch(async () =>
  Object.assign({}, ...await Promise.all(['three', ...ADDONS.map(a => `three/addons/${a}.js`)].map(m => import(m)))));
const { OrbitControls, EffectComposer, RenderPass, UnrealBloomPass, OutputPass, ShaderPass, RoundedBoxGeometry, Reflector,
  HorizontalBlurShader, VerticalBlurShader, CSS2DRenderer, CSS2DObject } = THREE;

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = window.matchMedia('(pointer: coarse)').matches;
const PR = Math.min(window.devicePixelRatio || 1, coarse ? 1.6 : 2);
const stage = document.getElementById('stage');
const loading = document.getElementById('loading');

// ---------- renderer ----------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  loading.textContent = 'この端末のブラウザでは3D表示を開始できませんでした。';
  throw err;
}
renderer.setPixelRatio(PR);
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.localClippingEnabled = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// units: centimetres, floor at y = 0
const camera = new THREE.PerspectiveCamera(36, stage.clientWidth / stage.clientHeight, 1, 1500);
camera.position.set(42, 42, 95);
const controls = new OrbitControls(camera, renderer.domElement);
// points that must stay in frame for the opening view: both hose tips, the hose arcs, the box and the head
const FRAME_PTS = [];
controls.target.set(0, 17, 0);
controls.enableDamping = true;
controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI;
controls.minDistance = 12;
controls.maxDistance = 170;
// zoom heads for the point under the fingers or the cursor, and a two-finger (or right-button) drag slides the view,
// so a close look can move from the screen down to the bottle; the point looked at stays within reach of the piece
controls.enablePan = true;
controls.screenSpacePanning = true;
controls.zoomToCursor = true;
controls.cursor.set(0, 20, 0);
controls.maxTargetRadius = 30;
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 0.8;

// ---------- procedural textures ----------
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// tileable value-noise fBm: period p (in lattice cells) doubles with each octave
function makeFbm(seed) {
  const rnd = mulberry32(seed), g = new Float32Array(256 * 256);
  for (let i = 0; i < g.length; i++) g[i] = rnd();
  const vn = (x, y, p) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const x0 = ((xi % p) + p) % p, y0 = ((yi % p) + p) % p, x1 = (x0 + 1) % p, y1 = (y0 + 1) % p;
    const a = g[y0 * 256 + x0], b = g[y0 * 256 + x1], c = g[y1 * 256 + x0], d = g[y1 * 256 + x1];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  return (x, y, p, oct) => {
    let s = 0, amp = 0.5, f = 1, n = 0;
    for (let o = 0; o < oct; o++) { s += amp * vn(x * f, y * f, Math.min(256, p * f)); n += amp; amp *= 0.5; f *= 2; }
    return s / n;
  };
}

function marbleTexture() {
  const S = 512, P = 12, fbm = makeFbm(7), rnd = mulberry32(11);
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S);
  // one jittered point per cell of a tileable P x P grid: the gap between nearest and second-nearest point is a crack
  const pts = Array.from({ length: P * P }, () => [0.15 + rnd() * 0.7, 0.15 + rnd() * 0.7]);
  const crack = (u, v) => {
    const cx = Math.floor(u), cy = Math.floor(v);
    let f1 = 9, f2 = 9;
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
      const gx = cx + i, gy = cy + j, q = pts[((gy % P + P) % P) * P + ((gx % P + P) % P)];
      const dx = gx + q[0] - u, dy = gy + q[1] - v, d = Math.sqrt(dx * dx + dy * dy);
      if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
    }
    return 1 - Math.min(1, (f2 - f1) / 0.055);
  };
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S * P, v = y / S * P;
    const n = fbm(u, v, P, 5), n2 = fbm(u + 3.1, v + 7.7, P, 4);
    const vein = Math.pow(1 - Math.abs(Math.sin(2 * Math.PI * (2 * u + v) / P + n * 7)), 14);
    const fine = Math.pow(1 - Math.abs(Math.sin(2 * Math.PI * (u - 3 * v) / P + n2 * 9)), 22);
    // the crack lines wander with the noise and fade in and out along their length
    const ck = Math.pow(crack(u + (n - 0.5) * 0.9, v + (n2 - 0.5) * 0.9), 3) * Math.min(1, Math.max(0.2, (n2 - 0.22) * 2.2));
    // near-black stone; a fine pale crackle carries the pattern, as in the hero shot
    const val = Math.min(1, Math.max(0, 0.11 + (n - 0.5) * 0.16 + (n2 - 0.5) * 0.06 + vein * 0.08 + fine * 0.03 + ck * 0.3));
    const i = (y * S + x) * 4;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = val * 255; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function smokeTexture() {
  const S = 128, fbm = makeFbm(21);
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = x / S * 2 - 1, dy = y / S * 2 - 1, r = Math.sqrt(dx * dx + dy * dy);
    const fall = Math.pow(Math.max(0, 1 - r), 1.5);
    const n = fbm(x / S * 4, y / S * 4, 256, 5);
    const a = Math.min(1, Math.max(0, (n - 0.32) * 2.4)) * fall;
    const i = (y * S + x) * 4;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = 255; img.data[i + 3] = a * 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.25, 'rgba(255,255,255,0.45)');
  grd.addColorStop(0.6, 'rgba(255,255,255,0.1)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const GLOW = glowTexture();
// the floor's marble is what marbleTexture() draws, saved once as tex/marble.jpg: it loads during the library download
// instead of taking a second of script at start. Without the file the pattern is drawn here as before.
const marbleReady = new THREE.TextureLoader().loadAsync('tex/marble.jpg').then((t) => {
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();

const HOSE_R = 0.7;
function hose(points) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'centripetal');
  root.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 300, HOSE_R, 28, false), M.silicone));
  const N = 2400, span = 0.2, turns = 40;
  const frames = curve.computeFrenetFrames(N, false);
  const coil = [];
  for (let i = 0; i <= N * span; i++) {
    const p = curve.getPointAt(i / N);
    const a = (i / (N * span)) * turns * Math.PI * 2;
    coil.push(p.add(frames.normals[i].clone().multiplyScalar(Math.cos(a) * (HOSE_R + 0.11)))
      .add(frames.binormals[i].clone().multiplyScalar(Math.sin(a) * (HOSE_R + 0.11))));
  }
  root.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(coil), coil.length * 2, 0.1, 8, false), M.chrome));
  const at = (t, len, r0, r1, mat, shift = 0) => {
    const p = curve.getPointAt(t), d = curve.getTangentAt(t);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, len, 40), mat);
    m.position.copy(p).addScaledVector(d, shift); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d); root.add(m);
    return m;
  };
  at(0.205, 1.2, HOSE_R + 0.22, HOSE_R + 0.22, M.chrome);
  // handle and mouth tip continue straight past the end of the hose
  const end = curve.getPointAt(1), dir = curve.getTangentAt(1);
  FRAME_PTS.push(end.clone().addScaledVector(dir, 9.7), ...points.map(p => new THREE.Vector3(...p)));
  const piece = (len, r0, r1, mat, from) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, len, 40), mat);
    m.position.copy(end).addScaledVector(dir, from + len / 2); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); root.add(m);
  };

}

function spawnBubble(b, micro) {
  const a = Math.random() * Math.PI * 2;
  if (micro) {

    const d = Math.random() * (IN - 0.6);
    b.x = Math.cos(a) * d; b.z = Math.sin(a) * d; b.y = T + 0.3 + Math.random() * 2.5;
    b.vx = b.vz = 0; b.vy = 1; b.r = 0.04 + Math.random() * 0.06; b.lift = 3.5;
  } else {
    b.x = Math.cos(a) * 3.5; b.z = Math.sin(a) * 3.5; b.y = T + 1.2 + Math.random() * 1.2;
    b.vx = Math.cos(a) * (4 + Math.random() * 5); b.vz = Math.sin(a) * (4 + Math.random() * 5);
    b.vy = 6; b.r = 0.16 + Math.pow(Math.random(), 2) * 0.62; b.lift = 15;

  puff.flow += ((active ? 1 : 0) - puff.flow) * Math.min(1, dt * (active ? 7 : 10));
  // the head lights up within a beat of the draw starting and fades out over a second or so
  puff.glow += ((active ? 1 : 0) - puff.glow) * Math.min(1, dt * (active ? 4.5 : 0.9));

  const boil = F * 0.35;

  surfGeo.computeVertexNormals();

  for (let i = 0; i < FN; i++) {

    dummy.position.set(f.x, WATER_Y + h + 0.02, f.z);
    const s = f.s * k;
    dummy.scale.set(s || 0.0001, (s * 0.55) || 0.0001, s || 0.0001);
    dummy.rotation.set(0, 0, 0);

}

    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) { /* older Safari */ } // play with the iPhone's silent switch on
    try { sound.ctx = new AC({ latencyHint: 'interactive' }); } catch (_) { return; }
    sound.eng = makeSound(sound.ctx);
    sound.eng.setSfx(sound.want.sfx);
    sound.eng.setMusic(sound.want.music);
    setInterval(() => { if (audible()) sound.eng.musicTick(); }, 50);
  }
  if (sound.ctx.state !== 'running') sound.ctx.resume().catch(() => {});
}
for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) window.addEventListener(ev, unlockAudio, { capture: true, passive: true });
document.addEventListener('visibilitychange', () => {
  if (!sound.ctx) return;
  if (document.hidden) sound.ctx.suspend().catch(() => {}); else sound.ctx.resume().catch(() => {});
});
function soundToggle(btn, key, apply) {
  btn.addEventListener('click', () => {
    // while the sound has not actually started, a press on it starts it instead of switching it off
    const justStarted = performance.now() - sound.silentAt < 800;
    if (!(justStarted && sound.want[key])) sound.want[key] = !sound.want[key];
    btn.setAttribute('aria-pressed', String(sound.want[key]));
    if (sound.eng) apply(sound.want[key]);
  });
}
soundToggle(document.getElementById('music'), 'music', (on) => sound.eng.setMusic(on));
soundToggle(document.getElementById('sfx'), 'sfx', (on) => sound.eng.setSfx(on));

// ---------- UI ----------
const presetBtns = document.querySelectorAll('[data-preset]');
presetBtns.forEach(b => b.addEventListener('click', () => {
  state.preset = b.dataset.preset;
  presetBtns.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));
const rotateBtn = document.getElementById('rotate');
rotateBtn.setAttribute('aria-pressed', String(controls.autoRotate));
rotateBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  rotateBtn.setAttribute('aria-pressed', String(controls.autoRotate));
});
// a room's photo loads the first time it is picked; until then the current room stays on screen
const sceneBtns = document.querySelectorAll('button[data-scene]');
let sceneReq = 0;
const markScene = (name) => sceneBtns.forEach(x => x.setAttribute('aria-pressed', String(x.dataset.scene === name)));
sceneBtns.forEach(b => b.addEventListener('click', () => {
  const name = b.dataset.scene, req = ++sceneReq;
  markScene(name);
  loadScene(name).then(() => {
    if (req !== sceneReq) return;
    state.scene = name; applyRoom();
  }).catch(() => { if (req === sceneReq) markScene(state.scene); });
}));
const dimsBtn = document.getElementById('dims-btn');
dimsBtn.addEventListener('click', () => { dimsOn = !dimsOn; dimsBtn.setAttribute('aria-pressed', String(dimsOn)); });

let fly = null;
// the opening view: three-quarters from a little above, so the front, one side and the lid all read, as in the hero shot
const HOME_DIR = new THREE.Vector3(0.4, 0.2, 0.9).normalize(), FRONT_DIR = new THREE.Vector3(0, 0.05, 1).normalize();
// the view buttons also bring the point looked at back to the piece after a drag has moved it
const HOME_T = controls.target.clone();
const ndc = new THREE.Vector3();
// the closest distance along dir at which every framing point lands inside the visible view, hose tips included
function fitDistance(dir, tgt = controls.target) {
  const keep = camera.position.clone();
  let lo = controls.minDistance, hi = controls.maxDistance;
  for (let i = 0; i < 16; i++) {
    const d = (lo + hi) / 2;
    camera.position.copy(tgt).addScaledVector(dir, d); camera.lookAt(tgt); camera.updateMatrixWorld();
    const fits = FRAME_PTS.every(p => { ndc.copy(p).project(camera); return Math.abs(ndc.x) < 0.9 && ndc.y < 0.84 && ndc.y > -0.9; });
    if (fits) hi = d; else lo = d;
  }
  camera.position.copy(keep); camera.lookAt(controls.target); camera.updateMatrixWorld();
  return Math.max(hi, 92);
}
const VIEWS = {
  front: () => HOME_T.clone().addScaledVector(FRONT_DIR, fitDistance(FRONT_DIR, HOME_T)),
  top: () => new THREE.Vector3(0.01, 118, 0.6),
  bottom: () => new THREE.Vector3(0.01, -82, 0.6),
};
let touched = false;
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  const v = { pos: VIEWS[b.dataset.view](), tgt: HOME_T };
  if (reduceMotion) { camera.position.copy(v.pos); controls.target.copy(v.tgt); return; }
  fly = { from: camera.position.clone(), to: v.pos, tFrom: controls.target.clone(), tTo: v.tgt.clone(), t0: performance.now(), dur: 900 };
}));
controls.addEventListener('start', () => { fly = null; touched = true; });

// keep every touch on the page itself: no scrolling, rubber-banding, page pinch-zoom or double-tap zoom. In LINE's
// browser a drag that pulls the page down reads as "close"; only a panel taller than the screen still scrolls.
// touchstart stays untouched: on iOS a cancelled touchstart can keep a tap from counting as the gesture that starts sound.
const scrollsY = (el) => { for (; el && el !== document.body; el = el.parentElement) if (el.scrollHeight > el.clientHeight + 1 && getComputedStyle(el).overflowY === 'auto') return true; return false; };
document.addEventListener('touchmove', (e) => { if (e.cancelable && (e.touches.length > 1 || !scrollsY(e.target))) e.preventDefault(); }, { passive: false });
for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });

const dock = document.querySelector('.dock'), head = document.querySelector('.head');
let uiHidden = false, viewFov = 41, shiftNow = 0, shiftGoal = 0;
// centre the piece in the free band of the screen, not behind the control dock (or, on a phone, where the title
// block spans the full width, under it); with the controls put away the whole screen is free
function viewShift() {
  if (uiHidden) return 0;
  const narrow = stage.clientWidth / stage.clientHeight < 0.8;
  const dh = Math.round(dock.getBoundingClientRect().height);
  const hh = narrow ? Math.round(head.getBoundingClientRect().bottom) : 0;
  return (dh - hh) / 2;
}
// render part of a taller virtual view whose field of view is widened so the visible part keeps the intended framing
function applyShift(shift) {
  const w = stage.clientWidth, h = stage.clientHeight, fullH = h + 2 * Math.abs(shift);
  camera.fov = 2 * Math.atan(Math.tan(viewFov * Math.PI / 360) * fullH / h) * 180 / Math.PI;
  camera.setViewOffset(w, fullH, 0, shift > 0 ? 2 * shift : 0, w, h);
  camera.updateProjectionMatrix();
}
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); composer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  viewFov = w / h < 0.8 ? 60 : 41; // wider on narrow screens, so the size labels beside the piece stay in frame
  shiftNow = shiftGoal = viewShift(); applyShift(shiftNow);
  const rw = Math.max(256, Math.round(w * PR * REFL_SCALE)), rh = Math.max(256, Math.round(h * PR * REFL_SCALE));
  reflector.getRenderTarget().setSize(rw, rh);
  reflector.material.uniforms.texel.value.set(1 / rw, 1 / rh);
  // until someone takes the camera, keep the whole piece framed as the screen and the panels change size
  if (homeSet && !touched) { fitDir.copy(camera.position).sub(controls.target).normalize(); camera.position.copy(controls.target).addScaledVector(fitDir, fitDistance(fitDir)); }
  if (homeSet) alignBackdrop();
}
const uiBtn = document.getElementById('ui-toggle');
uiBtn.addEventListener('click', () => {
  uiHidden = !uiHidden;
  document.body.classList.toggle('ui-off', uiHidden);
  uiBtn.setAttribute('aria-expanded', String(!uiHidden));
  uiBtn.querySelector('span').textContent = uiHidden ? '操作を表示' : '操作を隠す';
  shiftGoal = viewShift(); // the piece glides to the new centre in the frame loop
});
window.addEventListener('resize', resize);
if (window.ResizeObserver) { const ro = new ResizeObserver(resize); ro.observe(dock); ro.observe(head); } // both rewrap when fonts load or the width changes
const fitDir = new THREE.Vector3();
let homeSet = false;
resize();
camera.position.copy(controls.target).addScaledVector(HOME_DIR, fitDistance(HOME_DIR));
homeSet = true;
applyRoom();
drawScreen(puff.count, false);
bakeContactShadow();
// iOS drops the WebGL context when the app is backgrounded or short of memory. three re-uploads ordinary
// textures by itself, but the environment maps and the baked contact shadow existed only on the GPU.
renderer.domElement.addEventListener('webglcontextrestored', () => {
  ENV_DARK = pmrem.fromScene(studioScene(), 0.015).texture;
  for (const k in envTex) delete envTex[k];
  applyRoom(); bakeContactShadow(); drawScreen(puff.count, puff.wasActive);
});

// ---------- loop ----------
const clock = new THREE.Clock();
let first = true;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  simT += dt;
  const now = performance.now();
  updatePuff(now, dt, time);
  setColors(time, dt);
  updateHaze(time, dt);
  if (fly) {
    const k = Math.min(1, (now - fly.t0) / fly.dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    camera.position.lerpVectors(fly.from, fly.to, e);
    controls.target.lerpVectors(fly.tFrom, fly.tTo, e);
    if (k >= 1) fly = null;
  }
  if (shiftNow !== shiftGoal) {
    shiftNow += (shiftGoal - shiftNow) * Math.min(1, dt * 9);
    if (Math.abs(shiftGoal - shiftNow) < 0.5) shiftNow = shiftGoal;
    applyShift(shiftNow);
  }
  controls.update();
  updateDims();
  composer.render();
  labelRenderer.render(scene, camera);
  if (first) {
    loading.hidden = true; first = false;
    // fetch the three rooms once the studio is on screen, so switching never waits on the network
    setTimeout(() => { for (const n in SCENES) loadScene(n).catch(() => {}); }, 1200);
  }
  requestAnimationFrame(frame);
}
// Hand every shader to the browser before the first frame, with the composer's buffer bound so the variants match the
// ones the frames use. Queued together and given a moment before the first frame asks for them, they compile side by
// side instead of one after another inside that frame. Where the browser reports progress (KHR_parallel_shader_compile)
// the first frame waits until they are done.
let warm = null;
try {
  renderer.setRenderTarget(composer.readBuffer);
  if (renderer.extensions.has('KHR_parallel_shader_compile')) warm = renderer.compileAsync(scene, camera);
  else { renderer.compile(scene, camera); warm = new Promise(r => setTimeout(r, 16)); }
} catch (err) { /* the first frame compiles them */ }
renderer.setRenderTarget(null);
Promise.race([warm, new Promise(r => setTimeout(r, 6000))]).then(() => frame(), () => frame());
</script>
</body>
</html>
