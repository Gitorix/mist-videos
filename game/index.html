<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミストの街クエスト</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
/* Layout: one game screen — stage (slide backdrop + characters) above a message window, mini-games open as panels on the stage */
:root{
  --night:#13163a; --night2:#1d2257; --panel:#f7f4ff; --ink:#1b1c33; --muted:#5b5e86;
  --mint:#78beff; --grape:#be8cff; --lemon:#ffd75a; --good:#2fbf71; --bad:#e2556b; --line:#c9c3ef;
  --disp:"DotGothic16","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--panel);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--disp);font-weight:400;font-size:1.35rem;margin:0;letter-spacing:.06em;color:var(--lemon)}
.hud{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--disp);font-size:.95rem}
.hud span{background:var(--night2);border:2px solid var(--line);border-radius:6px;padding:2px 10px;font-variant-numeric:tabular-nums}
.chap{display:flex;gap:4px}
.chap i{width:26px;height:8px;border-radius:2px;background:#3a3f7a;display:block}
.chap i.on{background:var(--lemon)} .chap i.done{background:var(--good)}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border:3px solid var(--line);border-radius:10px;overflow:hidden;background:var(--night2)}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.45) saturate(.9);transition:opacity .4s}
.cast{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;height:70%;pointer-events:none}
.cast img{height:62%;max-width:30%;object-fit:contain;filter:brightness(.55);transition:transform .25s,filter .25s}
.cast img.talk{height:92%;filter:none;transform:translateY(-2%)}
@media (prefers-reduced-motion:reduce){.cast img,.bgimg{transition:none}}
.place{position:absolute;left:10px;top:10px;font-family:var(--disp);background:rgba(19,22,58,.8);border:2px solid var(--lemon);color:var(--lemon);padding:2px 10px;border-radius:4px;font-size:.9rem}
.msg{background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:10px;padding:12px 16px;min-height:118px;display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative}
.msg .who{font-family:var(--disp);font-size:1rem}
.msg .txt{font-size:1.05rem;line-height:1.7;min-height:3.4em}
.msg .next{position:absolute;right:14px;bottom:8px;font-family:var(--disp);color:var(--muted);font-size:.85rem}
.msg:focus-visible{outline:3px solid var(--lemon)}
/* mini-game panel */
.game{position:absolute;inset:4% 4% 4% 4%;background:rgba(247,244,255,.97);color:var(--ink);border-radius:10px;border:3px solid var(--lemon);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.game h2{font-family:var(--disp);font-weight:400;margin:0;font-size:1.15rem;color:#5a3fb8;letter-spacing:.04em}
.game p{margin:0;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--body);font-weight:700;font-size:1rem;border-radius:8px;border:2px solid #5a3fb8;background:#fff;color:var(--ink);padding:8px 14px;cursor:pointer}
button:hover{background:#efe9ff} button:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
button.pri{background:#5a3fb8;color:#fff} button.pri:hover{background:#4a31a0}
button.ok{border-color:var(--good);background:#e6f8ee} button.ng{border-color:var(--bad);background:#fdecef}
button:disabled{opacity:.5;cursor:default}
.card{border:2px dashed var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bin{border:2px solid var(--line);border-radius:8px;padding:8px;min-height:70px;background:#faf8ff}
.bin b{font-family:var(--disp);font-weight:400}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;margin:3px;font-size:.9rem;background:#ece6ff}
.chip.ok{background:#d8f5e4} .chip.ng{background:#fbd9df}
.fb{font-weight:700;min-height:1.5em} .fb.ok{color:var(--good)} .fb.ng{color:var(--bad)}
.meter{position:relative;height:26px;border-radius:6px;background:#e3defa;overflow:hidden;border:2px solid var(--line)}
.meter .zone{position:absolute;top:0;bottom:0;background:#bdeccf}
.meter .bar{position:absolute;top:0;bottom:0;left:0;background:#7d5ce0}
.big{font-family:var(--disp);font-size:1.6rem;font-variant-numeric:tabular-nums}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.flow .slot{min-width:110px;min-height:44px;border:2px dashed #5a3fb8;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:4px 8px;background:#fff}
.flow .arr{font-family:var(--disp)}
.small{font-size:.85rem;color:var(--muted)}
.end{text-align:center;align-items:center;justify-content:center}
@media (max-width:560px){
  .stage{aspect-ratio:3/4}
  .cast img{height:50%} .cast img.talk{height:78%}
  .bins{grid-template-columns:1fr}
  .msg .txt{font-size:1rem}
}
</style>

function talk(s,t){
  [0,1,2].forEach(k=>$("c"+k).classList.toggle("talk",k===s));
  $("who").textContent=NAMES[s];$("who").style.color=COLORS[s];$("txt").textContent=t;$("nx").hidden=false;
}
function scene([place,bg,ch]){$("place").textContent=place;$("bg").src=IMG[bg];chapter=ch;st();}
function next(){
  if(busy) return;
  while(i<S.length){
    const s=S[i++];
    if(s.scene){scene(s.scene);continue}
    if(s.game){busy=true;$("nx").hidden=true;G[s.game](s,()=>{busy=false;$("game").hidden=true;next()});return}
    talk(s[0],s[1]);return;
  }
}
function panel(html){const g=$("game");g.innerHTML=html;g.hidden=false;return g}
function win(n){star+=n;st()}

const G={
 sort(_,done){
  const items=[["ニコチンなし","m"],["超音波で霧にする","m"],["吸うとトークンがたまる","m"],["本体 約9,500円","m"],["ニコチンあり","i"],["加熱式","i"],["本体 約12,500円","i"]].sort(()=>Math.random()-.5);
  let k=0,ok=0;
  const g=panel(`<h2>仕分けゲーム　ミスト？アイコス？</h2><p>出てきた特徴が、どちらのものかを選んでください。</p>
   <div class="card big" id="it"></div><div class="row"><button id="bm">ミスト</button><button id="bi">アイコス</button></div>
   <div class="bins"><div class="bin"><b>ミスト</b><div id="pm"></div></div><div class="bin"><b>アイコス</b><div id="pi"></div></div></div><div class="fb" id="fb"></div>`);
  const show=()=>{g.querySelector("#it").textContent=items[k][0]};show();
  const pick=w=>{const [t,a]=items[k];const r=a===w;ok+=r;
    g.querySelector(a==="m"?"#pm":"#pi").insertAdjacentHTML("beforeend",`<span class="chip ${r?'ok':'ng'}">${t}</span>`);
    const fb=g.querySelector("#fb");fb.className="fb "+(r?"ok":"ng");fb.textContent=r?"正解！":"これは"+(a==="m"?"ミスト":"アイコス")+"でした";
    if(++k<items.length) show(); else {g.querySelector("#it").textContent=`${items.length}問中 ${ok}問正解`;
      g.querySelectorAll(".row button").forEach(b=>b.disabled=true);win(ok>=6?2:1);
      g.insertAdjacentHTML("beforeend",`<div class="row"><button class="pri" id="go">次へ進む</button></div>`);g.querySelector("#go").onclick=done;}};
  g.querySelector("#bm").onclick=()=>pick("m");g.querySelector("#bi").onclick=()=>pick("i");
 },
 puff(_,done){
  let n=0,good=0,t=0,dir=1,raf,holding=false,val=0;
  const g=panel(`<h2>マイニング　ちょうどよく吸おう</h2><p>ボタンを押している間、ゲージがたまります。緑のゾーンで離すと、上手に吸えてミストが掘れます。8回チャレンジ。</p>
   <div class="meter"><div class="zone" style="left:55%;width:25%"></div><div class="bar" id="bar" style="width:0"></div></div>
   <div class="row"><button class="pri" id="hold">押して吸う</button></div><div class="big" id="cnt">0 / 8 回</div><div class="fb" id="fb"></div>`);
  const bar=g.querySelector("#bar"),fb=g.querySelector("#fb"),btn=g.querySelector("#hold");
  const loop=()=>{val=Math.min(100,val+1.6);bar.style.width=val+"%";if(holding) raf=requestAnimationFrame(loop)};
  const start=e=>{e.preventDefault();if(n>=8||holding)return;holding=true;val=0;loop()};
  const end=()=>{if(!holding)return;holding=false;cancelAnimationFrame(raf);n++;
    const hit=val>=55&&val<=80;if(hit){good++;mist+=110;st()}
    fb.className="fb "+(hit?"ok":"ng");fb.textContent=hit?"いい吸い方！ +110 MIST":(val<55?"浅すぎ…":"吸いすぎ…");
    g.querySelector("#cnt").textContent=`${n} / 8 回`;
    if(n>=8){btn.disabled=true;win(good>=5?2:1);
      fb.textContent=`${good}回上手に吸えて、合計 ${good*110} MIST！（本物は1本でおよそ800〜900ミスト）`;
      g.insertAdjacentHTML("beforeend",`<div class="row"><button class="pri" id="go">次へ進む</button></div>`);g.querySelector("#go").onclick=done;}};
  btn.addEventListener("pointerdown",start);btn.addEventListener("pointerup",end);btn.addEventListener("pointerleave",end);
  btn.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!e.repeat)start(e)});btn.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter")end()});
 },
 quiz(s,done){
  const g=panel(`<h2>クイズ</h2><p>${s.q}</p><div class="row" id="ans">${s.a.map((a,k)=>`<button data-k="${k}">${a}</button>`).join("")}</div><div class="fb" id="fb"></div>`);
  g.querySelectorAll("#ans button").forEach(b=>b.onclick=()=>{const r=+b.dataset.k===s.c;
    g.querySelectorAll("#ans button").forEach(x=>{x.disabled=true;if(+x.dataset.k===s.c)x.classList.add("ok")});if(!r)b.classList.add("ng");
    const fb=g.querySelector("#fb");fb.className="fb "+(r?"ok":"ng");fb.textContent=r?s.ok:s.ng;if(r)win(1);
    g.insertAdjacentHTML("beforeend",`<div class="row"><button class="pri" id="go">次へ進む</button></div>`);g.querySelector("#go").onclick=done;});
 },
 calc(_,done){
  const qs=[{q:"6月のセールは5万円で1万ミスト。1ミストはいくら？",a:["2円","5円","7円"],c:1},
            {q:"同じ5万円を、1月のNFT（1ミスト約2円）で使っていたら何ミスト？",a:["1万ミスト","2万5000ミスト","5万ミスト"],c:1},
            {q:"6月の時点で、上場したときの価格の見込みは？",a:["7円ちょうど","5〜7円の間","100円以上"],c:1}];
  let k=0,ok=0;
  const g=panel(`<h2>値段の計算チャレンジ</h2><div id="box"></div><div class="fb" id="fb"></div>`);
  const show=()=>{const q=qs[k];g.querySelector("#box").innerHTML=`<p class="small">${k+1} / ${qs.length}</p><p>${q.q}</p><div class="row">${q.a.map((a,j)=>`<button data-j="${j}">${a}</button>`).join("")}</div>`;
    g.querySelectorAll("#box button").forEach(b=>b.onclick=()=>{const r=+b.dataset.j===q.c;ok+=r;const fb=g.querySelector("#fb");
      fb.className="fb "+(r?"ok":"ng");fb.textContent=r?"正解！":"答えは「"+q.a[q.c]+"」";
      if(++k<qs.length) show(); else {g.querySelector("#box").innerHTML=`<p class="big">${qs.length}問中 ${ok}問正解</p><p>1月は約2円、6月のセールは5円、上場の見込みは7円から「5〜7円」へ。早く買った人ほど安かった、というのが配信で話された流れです。</p>`;
        win(ok>=2?2:1);g.insertAdjacentHTML("beforeend",`<div class="row"><button class="pri" id="go">次へ進む</button></div>`);g.querySelector("#go").onclick=done;}})};
  show();
 },
 unlock(_,done){
  const g=panel(`<h2>ロック解除シミュレーター</h2><p>1万ミストを持っているとします。上場から1か月後に5%が使えるようになり、その後は毎日0.5%ずつ使えるようになる、と説明されていました。</p>
   <label for="d">上場1か月後から <b id="dv">0</b> 日目</label><input id="d" type="range" min="0" max="190" value="0" style="width:100%">
   <div class="big" id="u"></div>
   <p>質問：使える量が全部（100%）になるのは、上場1か月後から何日目？</p>
   <div class="row" id="ans"><button data-v="100">100日目</button><button data-v="190">190日目</button><button data-v="365">365日目</button></div><div class="fb" id="fb"></div>`);
  const r=g.querySelector("#d"),upd=()=>{const d=+r.value,p=Math.min(100,5+0.5*d);g.querySelector("#dv").textContent=d;g.querySelector("#u").textContent=`使える量 ${Math.round(100*p)}ミスト（${p}%）`};
  r.oninput=upd;upd();
  g.querySelectorAll("#ans button").forEach(b=>b.onclick=()=>{const ok=b.dataset.v==="190";g.querySelectorAll("#ans button").forEach(x=>x.disabled=true);
    b.classList.add(ok?"ok":"ng");const fb=g.querySelector("#fb");fb.className="fb "+(ok?"ok":"ng");
    fb.textContent=ok?"正解！残り95%を毎日0.5%ずつなので190日です。":"おしい。残り95%を毎日0.5%ずつなので190日目です。";if(ok)win(1);
    g.insertAdjacentHTML("beforeend",`<div class="row"><button class="pri" id="go">次へ進む</button></div>`);g.querySelector("#go").onclick=done;});
 },
 route(_,done){
  const order=["バイナンスアルファ","ビットマート","バイナンス本体"];let pos=0,miss=0;
  const g=panel(`<h2>上場ルートをつなごう（6月24日AMA）</h2><p>6月に説明された順番になるよう、カードを選んで並べてください。</p>
   <div class="flow" id="flow">${order.map((_,k)=>`<div class="slot" id="s${k}">？</div>${k<2?'<span class="arr">→</span>':''}`).join("")}</div>
   <div class="row" id="cards">${[...order,"エムイーエックスシー"].sort(()=>Math.random()-.5).map(c=>`<button>${c}</button>`).join("")}</div><div class="fb" id="fb"></div>`);
  const fb=g.querySelector("#fb");
  g.querySelectorAll("#cards button").forEach(b=>b.onclick=()=>{
    if(b.textContent===order[pos]){g.querySelector("#s"+pos).textContent=b.textContent;b.disabled=true;pos++;fb.className="fb ok";fb.textContent="つながった！";
      if(pos===3) twist();}
    else{miss++;fb.className="fb ng";fb.textContent=b.textContent==="エムイーエックスシー"?"そこは「避ける」と言っていた取引所です":"順番がちがいます"}});
  function twist(){
    g.querySelectorAll("#cards button").forEach(x=>x.disabled=true);
    g.insertAdjacentHTML("beforeend",`<div class="card"><b>事件発生！（7月30日）</b><p>ビットマートが閉鎖することになりました。代わりのルートはどれ？</p>
     <div class="row" id="alt"><button data-ok="1">バイナンスアルファ＋分散型取引所（パンケーキスワップなど）</button><button>上場をやめる</button><button>エムイーエックスシー</button></div></div>`);
    g.querySelectorAll("#alt button").forEach(b=>b.onclick=()=>{const ok=!!b.dataset.ok;g.querySelectorAll("#alt button").forEach(x=>x.disabled=true);b.classList.add(ok?"ok":"ng");
      g.querySelector("#s1").textContent="閉鎖";g.querySelector("#s1").style.textDecoration="line-through";
      fb.className="fb "+(ok?"ok":"ng");fb.textContent=ok?"正解！7月にこの方針へ切り替わりました。":"答えは「バイナンスアルファ＋分散型取引所」でした。";
      win((ok?1:0)+(miss===0?1:0));g.insertAdjacentHTML("beforeend",`<div class="row"><button class="pri" id="go">次へ進む</button></div>`);g.querySelector("#go").onclick=done;});
  }
 },
 carbon(_,done){
  let co2=130,bought=0;const cap=100;
  const g=panel(`<h2>カーボン取引をさばこう</h2><p>あなたは工場の担当者。今年のCO2の上限は100トンなのに、130トン出してしまいました。足りない分を、CO2を減らした人たちから「削減分（クレジット）」として買い取りましょう。</p>
   <div class="big" id="st"></div>
   <div class="row" id="offers">
    <button data-n="20" data-v="1">牧場：牛のげっぷのメタンを海藻のえさで削減　20トン（記録はブロックチェーン）</button>
    <button data-n="10" data-v="1">ミスト利用者：吸うたびに記録されたデータ　10トン（記録はブロックチェーン）</button>
    <button data-n="30" data-v="0">出どころ不明の削減データ　30トン（記録なし・確認できない）</button>
   </div><div class="fb" id="fb"></div>`);
  const fb=g.querySelector("#fb"),upd=()=>{g.querySelector("#st").textContent=`排出 ${co2}トン − 買い取り ${bought}トン ＝ ${co2-bought}トン（上限 ${cap}）`};upd();
  let ng=0;
  g.querySelectorAll("#offers button").forEach(b=>b.onclick=()=>{
    if(b.dataset.v==="0"){ng++;b.disabled=true;b.classList.add("ng");fb.className="fb ng";fb.textContent="確認できないデータは信用できません。本当に減ったか分からないからです。";return}
    bought+=+b.dataset.n;b.disabled=true;b.classList.add("ok");upd();
    if(co2-bought<=cap){fb.className="fb ok";fb.textContent="上限におさまりました！確かめられる削減分だけで、ぴったり帳尻が合いました。";
      g.querySelectorAll("#offers button").forEach(x=>x.disabled=true);win(ng?1:2);
      g.insertAdjacentHTML("beforeend",`<div class="row"><button class="pri" id="go">次へ進む</button></div>`);g.querySelector("#go").onclick=done;}
    else{fb.className="fb ok";fb.textContent="いいね！あと"+(co2-bought-cap)+"トン。"}});
 },
 end(){
  const max=14;const rank=star>=12?"ミスト博士":star>=8?"ミスト通":"ミスト見習い";
  const g=panel(`<div class="end" style="display:flex;flex-direction:column;gap:12px;height:100%"><h2 style="font-size:1.6rem">クエストクリア！</h2>
   <p class="big">★ ${star} / ${max}</p><p>称号：<b>${rank}</b>　マイニングで集めたミスト：${mist.toLocaleString()}</p>
   <p class="small">ゲームの数字は学習用です。本物の価格や上場時期は、最新の配信や公式情報で確認してください。</p>
   <div class="row" style="justify-content:center"><button class="pri" id="again">もう一度あそぶ</button></div></div>`);
  $("nx").hidden=true;
  g.querySelector("#again").onclick=()=>{star=0;mist=0;i=0;busy=false;g.hidden=true;next()};
 }
};
$("msg").addEventListener("click",next);
$("msg").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();next()}});
st();next();
</script>
